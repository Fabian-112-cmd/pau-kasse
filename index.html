<!doctype html>
<html lang="de">
<head>
  <!-- Grundeinstellungen -->
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="description" content="Abrechnungshilfe für Getränke und Speisen mit bearbeitbaren Preisen und Tagesübersicht.">
  <title>PAU · MAYA – Kasse</title>

  <!-- App-Symbol und Darstellung -->
  <link rel="apple-touch-icon" href="icon-180.png">
  <link rel="icon" href="icon-192.png">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="stylesheet" href="style.css?v=10">
</head>
<body>
  <!-- Kopfzeile und Navigation -->
  <header>
    <div class="brand">
      <span class="mark">P</span>
      <div>
        <strong>PAU · MAYA</strong>
        <small>Straußwirtschaft · Kasse</small>
      </div>
    </div>
    <nav aria-label="Hauptnavigation">
      <button data-view="sale" class="active">Abrechnen</button>
      <button data-view="day">Tagesübersicht</button>
      <button data-view="year">Jahresübersicht</button>
      <button data-view="settings">Artikel & Preise</button>
    </nav>
  </header>
  <div id="account" class="account"></div>

  <!-- Die jeweilige Ansicht wird durch app.js eingefügt -->
  <main id="main"></main>

  <!-- Kurze Rückmeldungen -->
  <div id="toast" role="status"></div>

  <!-- Bestätigungsfenster -->
  <dialog id="confirm">
    <form method="dialog">
      <h2 id="dialog-title"></h2>
      <p id="dialog-text"></p>
      <div class="dialog-actions">
        <button value="cancel">Abbrechen</button>
        <button id="confirm-button" class="primary" value="ok">Bestätigen</button>
      </div>
    </form>
  </dialog>

  <!-- Versionsnummer sorgt dafür, dass der neue Code geladen wird -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js?v=10"></script>
  <script src="app.js?v=10"></script>
  <script src="cloud.js?v=10"></script>
</body>
</html>
